title: Alessandro Mantoan
email: alessandro.mantoan.dp@gmail.com
description: Archivista digitale specializzato in preservazione audiovisiva e patrimonio multimediale.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://alessandro-mantoan-dp.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  alessandro-mantoan-dp

# Build settings
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "neon"
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

author:
  bio: "Archivista digitale. Preservazione audiovisiva, patrimonio culturale digitale, standard OAIS."
  location: "Desio, MB, Italia"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/alessandro-mantoan000/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true